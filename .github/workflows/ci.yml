name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Byte-compile all sources
        run: python -m compileall -q src scripts fb_change_pfp.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Static security scan (medium severity and above)
        run: bandit -q -r src -ll

      - name: Dependency advisory check
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt
          pip-audit --requirement requirements-dev.txt

  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject em dashes and en dashes
        run: python scripts/check_text.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          pip install build
          python -m build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject media and archives outside docs/assets
        run: |
          offenders=$(git ls-files | grep -iE '\.(jpg|jpeg|webp|heic|gif|mp4|mov|zip|tar|gz|pdf)$' | grep -v '^docs/assets/') || true
          if [ -n "$offenders" ]; then
            echo "Media/archive files are only allowed under docs/assets/:"
            echo "$offenders"
            exit 1
          fi
