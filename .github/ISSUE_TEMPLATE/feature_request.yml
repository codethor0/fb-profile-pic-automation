name: Feature request
description: Suggest a change or a new image source.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see? Keep to what this tool does, which is changing one profile picture from your own browser.
    validations:
      required: false
