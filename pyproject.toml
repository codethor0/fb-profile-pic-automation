[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-pfp"
dynamic = ["version"]
description = "Change your Facebook profile picture through your own logged-in Brave browser."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "codethor0" }]
keywords = ["facebook", "brave", "automation", "playwright", "cdp", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "bandit>=1.7"]

[project.scripts]
fb-pfp = "fb_pfp.cli:main"

[project.urls]
Homepage = "https://github.com/codethor0/fb-profile-pic-automation"
Issues = "https://github.com/codethor0/fb-profile-pic-automation/issues"
Changelog = "https://github.com/codethor0/fb-profile-pic-automation/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fb_pfp.__version__" }

[tool.bandit]
exclude_dirs = ["tests"]
